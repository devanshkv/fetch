[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fetch"
version = "0.3.0"
description = "FETCH (Fast Extragalactic Transient Candidate Hunter) - ONNX Edition"
authors = [
    {name = "Devansh Agarwal", email = "devansh.kv@gmail.com"},
]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["astronomy", "machine-learning", "transients", "onnx"]
classifiers = [
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Development Status :: 4 - Beta",
]

# Core dependencies (CPU-only ONNX inference)
dependencies = [
    "pandas>=1.2.2",
    "numpy>=1.19.5",
    "scipy>=1.6.0",
    "h5py>=3.0.0",
    "onnxruntime>=1.15.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
# GPU acceleration support
gpu = [
    "onnxruntime-gpu>=1.15.0",
]

# Testing dependencies
test = [
    "pytest>=6.0.0",
]

# Development dependencies  
dev = [
    "pytest>=6.0.0",
    "ruff>=0.1.0",
]

# All optional dependencies
all = [
    "onnxruntime-gpu>=1.15.0",
    "pytest>=6.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/devanshkv/fetch"
Repository = "https://github.com/devanshkv/fetch"
Documentation = "https://github.com/devanshkv/fetch/blob/onnx/README.md"
"Bug Tracker" = "https://github.com/devanshkv/fetch/issues"

[project.scripts]
fetch-predict = "fetch.predict_onnx:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


# Ruff configuration
[tool.ruff]
target-version = "py38"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
