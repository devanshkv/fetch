name: tests

on:
  push:
  pull_request:

jobs:
  pytorch:
    # The PyTorch side on CPU: the graph builder, the candidate reader and the weight download need no
    # weights; model a (180 MB, cached between runs) is checked against TensorFlow FETCH's probabilities
    # and run end to end through predict_torch.py.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[test]"
      - uses: actions/cache@v4
        with:
          path: ~/.keras/models
          key: fetch-weights-a-${{ hashFiles('fetch/models/model_list.csv') }}
      - name: Test
        env:
          FETCH_TEST_DOWNLOAD: "1"
          FETCH_TEST_MODELS: a
        run: pytest -v tests/test_keras_graph.py tests/test_data.py tests/test_pytorch_models.py
